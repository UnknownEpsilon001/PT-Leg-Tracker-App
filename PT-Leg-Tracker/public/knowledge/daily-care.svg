<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300" role="img" aria-label="ท่านั่งที่ควรทำและควรเลี่ยง">
  <!-- [TH] ควรนั่งเก้าอี้เข่างอ 90 องศา เลี่ยงนั่งยอง/พับเพียบ -->
  <!-- Do: sit on a chair, knee at 90°. Don't: squat or sit folded on the floor. -->
  <rect width="400" height="300" fill="#f7f5f0"/>

  <!-- ควรทำ / do -->
  <g>
    <circle cx="40" cy="46" r="18" fill="#2f6b45"/>
    <path d="M31 46 l7 8 l12 -15" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="70" y="54" font-family="'Noto Sans Thai','Sarabun',sans-serif" font-size="22" fill="#2f6b45">ควรทำ</text>
    <circle cx="96" cy="106" r="14" fill="#ffffff" stroke="#24395e" stroke-width="3"/>
    <path d="M96 120 v44" stroke="#24395e" stroke-width="4" stroke-linecap="round"/>
    <path d="M96 164 h44" stroke="#24395e" stroke-width="4" stroke-linecap="round"/>
    <path d="M140 164 v40" stroke="#24395e" stroke-width="4" stroke-linecap="round"/>
    <path d="M136 204 h20" stroke="#24395e" stroke-width="4" stroke-linecap="round"/>
    <!-- เก้าอี้ / chair -->
    <path d="M84 164 h64 M148 164 v44 M84 164 v44 M84 118 v46" fill="none" stroke="#c6ccd6" stroke-width="6" stroke-linecap="round"/>
    <path d="M124 158 a20 20 0 0 0 18 18" fill="none" stroke="#2f6b45" stroke-width="3"/>
    <text x="116" y="238" font-family="'Noto Sans Thai','Sarabun',sans-serif" font-size="18" text-anchor="middle" fill="#24395e">นั่งเก้าอี้ เท้าราบพื้น</text>
    <text x="116" y="262" font-family="'Noto Sans Thai','Sarabun',sans-serif" font-size="16" text-anchor="middle" fill="#56607a">เข่างอราว 90 องศา</text>
  </g>

  <line x1="200" y1="30" x2="200" y2="270" stroke="#c6ccd6" stroke-width="2"/>

  <!-- ควรเลี่ยง / don't -->
  <g>
    <circle cx="240" cy="46" r="18" fill="#8c2f39"/>
    <path d="M233 39 l14 14 M247 39 l-14 14" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    <text x="270" y="54" font-family="'Noto Sans Thai','Sarabun',sans-serif" font-size="22" fill="#8c2f39">ควรเลี่ยง</text>
    <circle cx="300" cy="112" r="14" fill="#ffffff" stroke="#24395e" stroke-width="3"/>
    <path d="M300 126 v34" stroke="#24395e" stroke-width="4" stroke-linecap="round"/>
    <path d="M300 160 l30 8 l-10 36 h-46" fill="none" stroke="#24395e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M300 160 l-24 20 v24" fill="none" stroke="#24395e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="330" cy="168" r="11" fill="none" stroke="#8c2f39" stroke-width="4"/>
    <path d="M258 204 h84" stroke="#c6ccd6" stroke-width="6" stroke-linecap="round"/>
    <text x="300" y="238" font-family="'Noto Sans Thai','Sarabun',sans-serif" font-size="18" text-anchor="middle" fill="#24395e">นั่งยอง พับเพียบ คุกเข่า</text>
    <text x="300" y="262" font-family="'Noto Sans Thai','Sarabun',sans-serif" font-size="16" text-anchor="middle" fill="#56607a">และขึ้นลงบันไดบ่อย ๆ</text>
  </g>
</svg>
