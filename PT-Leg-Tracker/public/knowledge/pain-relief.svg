<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300" role="img" aria-label="ประคบอุ่น 15 ถึง 20 นาที และบริหารกล้ามเนื้อต้นขา">
  <!-- [TH] บรรเทาปวด: พักการใช้งาน ประคบอุ่น 15-20 นาที แล้วบริหารต้นขา -->
  <!-- Relief: rest, warm compress 15-20 min, then thigh exercise. -->
  <rect width="400" height="300" fill="#f7f5f0"/>

  <!-- ประคบอุ่น / warm compress -->
  <g>
    <text x="108" y="42" font-family="'Noto Sans Thai','Sarabun',sans-serif" font-size="21" text-anchor="middle" fill="#24395e">ประคบอุ่น</text>
    <path d="M60 150 h56 l34 20" fill="none" stroke="#24395e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M60 186 h56 l34 20" fill="none" stroke="#24395e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="96" y="140" width="48" height="56" rx="12" fill="#8c2f39" opacity="0.18" stroke="#8c2f39" stroke-width="3"/>
    <path d="M110 132 q6 -10 0 -20 M124 132 q6 -10 0 -20 M138 132 q6 -10 0 -20" fill="none" stroke="#8c2f39" stroke-width="3" stroke-linecap="round"/>
    <text x="108" y="240" font-family="'Noto Sans Thai','Sarabun',sans-serif" font-size="18" text-anchor="middle" fill="#24395e">ครั้งละ 15-20 นาที</text>
    <text x="108" y="264" font-family="'Noto Sans Thai','Sarabun',sans-serif" font-size="16" text-anchor="middle" fill="#56607a">พักการใช้งานเข่า</text>
  </g>

  <line x1="200" y1="30" x2="200" y2="270" stroke="#c6ccd6" stroke-width="2"/>

  <!-- บริหารต้นขา / thigh exercise -->
  <g>
    <text x="300" y="42" font-family="'Noto Sans Thai','Sarabun',sans-serif" font-size="21" text-anchor="middle" fill="#24395e">บริหารต้นขา</text>
    <circle cx="256" cy="104" r="14" fill="#ffffff" stroke="#24395e" stroke-width="3"/>
    <path d="M256 118 v46" stroke="#24395e" stroke-width="4" stroke-linecap="round"/>
    <path d="M256 164 h40" stroke="#24395e" stroke-width="4" stroke-linecap="round"/>
    <!-- ขาเหยียดขึ้น / leg extending up -->
    <path d="M296 164 l44 -22" stroke="#8c2f39" stroke-width="5" stroke-linecap="round"/>
    <path d="M340 142 l12 -6" stroke="#8c2f39" stroke-width="5" stroke-linecap="round"/>
    <path d="M300 186 a34 34 0 0 0 30 -30" fill="none" stroke="#8c2f39" stroke-width="3" stroke-dasharray="5 5"/>
    <path d="M244 164 h-16 v44" fill="none" stroke="#c6ccd6" stroke-width="6" stroke-linecap="round"/>
    <path d="M228 164 h68 M296 164 v44" fill="none" stroke="#c6ccd6" stroke-width="6" stroke-linecap="round"/>
    <text x="300" y="240" font-family="'Noto Sans Thai','Sarabun',sans-serif" font-size="18" text-anchor="middle" fill="#24395e">เหยียดเข่าค้างไว้</text>
    <text x="300" y="264" font-family="'Noto Sans Thai','Sarabun',sans-serif" font-size="16" text-anchor="middle" fill="#56607a">ทำสม่ำเสมอตามโปรแกรม</text>
  </g>
</svg>
