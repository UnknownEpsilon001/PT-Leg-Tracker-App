<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300" role="img" aria-label="เปรียบเทียบข้อเข่าปกติกับข้อเข่าเสื่อม">
  <!-- [TH] ภาพเปรียบเทียบ: กระดูกอ่อนหนาปกติ (ซ้าย) กับกระดูกอ่อนสึกและมีกระดูกงอก (ขวา) -->
  <!-- Healthy cartilage (left) vs worn cartilage with osteophytes (right). -->
  <rect width="400" height="300" fill="#f7f5f0"/>

  <!-- ข้อเข่าปกติ / healthy knee -->
  <g>
    <rect x="70" y="30" width="60" height="62" rx="14" fill="#ffffff" stroke="#24395e" stroke-width="3"/>
    <circle cx="86" cy="98" r="19" fill="#ffffff" stroke="#24395e" stroke-width="3"/>
    <circle cx="114" cy="98" r="19" fill="#ffffff" stroke="#24395e" stroke-width="3"/>
    <rect x="62" y="120" width="76" height="18" rx="9" fill="#5b7fb8" stroke="#24395e" stroke-width="3"/>
    <rect x="62" y="140" width="76" height="16" rx="8" fill="#ffffff" stroke="#24395e" stroke-width="3"/>
    <rect x="76" y="152" width="48" height="60" rx="14" fill="#ffffff" stroke="#24395e" stroke-width="3"/>
    <text x="100" y="245" font-family="'Noto Sans Thai','Sarabun',sans-serif" font-size="22" text-anchor="middle" fill="#24395e">ข้อเข่าปกติ</text>
    <text x="100" y="272" font-family="'Noto Sans Thai','Sarabun',sans-serif" font-size="17" text-anchor="middle" fill="#56607a">กระดูกอ่อนหนา</text>
  </g>

  <!-- ข้อเข่าเสื่อม / osteoarthritic knee -->
  <g>
    <rect x="270" y="30" width="60" height="62" rx="14" fill="#ffffff" stroke="#24395e" stroke-width="3"/>
    <circle cx="286" cy="102" r="19" fill="#ffffff" stroke="#24395e" stroke-width="3"/>
    <circle cx="314" cy="102" r="19" fill="#ffffff" stroke="#24395e" stroke-width="3"/>
    <path d="M262 124 h76 v6 h-76 z" fill="#8c2f39"/>
    <path d="M262 136 l10 -6 l10 6 l10 -6 l10 6 l10 -6 l10 6 l10 -6 l6 6 z" fill="#ffffff" stroke="#24395e" stroke-width="3" stroke-linejoin="round"/>
    <rect x="262" y="136" width="76" height="16" rx="6" fill="#ffffff" stroke="#24395e" stroke-width="3"/>
    <path d="M262 130 l-14 -8 l14 -2 z" fill="#8c2f39"/>
    <path d="M338 130 l14 -8 l-14 -2 z" fill="#8c2f39"/>
    <rect x="276" y="152" width="48" height="60" rx="14" fill="#ffffff" stroke="#24395e" stroke-width="3"/>
    <text x="300" y="245" font-family="'Noto Sans Thai','Sarabun',sans-serif" font-size="22" text-anchor="middle" fill="#8c2f39">ข้อเข่าเสื่อม</text>
    <text x="300" y="272" font-family="'Noto Sans Thai','Sarabun',sans-serif" font-size="17" text-anchor="middle" fill="#56607a">กระดูกอ่อนสึก มีกระดูกงอก</text>
  </g>
</svg>
