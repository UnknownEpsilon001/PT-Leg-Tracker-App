<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300" role="img" aria-label="ปัจจัยเสี่ยงข้อเข่าเสื่อม อายุมาก น้ำหนักเกิน และการนั่งยอง">
  <!-- [TH] สามปัจจัยเสี่ยงหลัก: อายุ น้ำหนักตัว และท่านั่งที่งอเข่ามาก -->
  <!-- Three main risk factors: age, body weight, deep-flexion sitting. -->
  <rect width="400" height="300" fill="#f7f5f0"/>
  <text x="200" y="40" font-family="'Noto Sans Thai','Sarabun',sans-serif" font-size="24" text-anchor="middle" fill="#24395e">ปัจจัยเสี่ยง</text>

  <!-- อายุมาก / age -->
  <g>
    <circle cx="70" cy="130" r="40" fill="#ffffff" stroke="#24395e" stroke-width="3"/>
    <circle cx="70" cy="130" r="3" fill="#24395e"/>
    <path d="M70 130 V106" stroke="#24395e" stroke-width="4" stroke-linecap="round"/>
    <path d="M70 130 L88 142" stroke="#8c2f39" stroke-width="4" stroke-linecap="round"/>
    <text x="70" y="204" font-family="'Noto Sans Thai','Sarabun',sans-serif" font-size="17" text-anchor="middle" fill="#24395e">อายุมากขึ้น</text>
    <text x="70" y="228" font-family="'Noto Sans Thai','Sarabun',sans-serif" font-size="14" text-anchor="middle" fill="#56607a">40 ปีขึ้นไป</text>
  </g>

  <!-- น้ำหนักเกิน / overweight -->
  <g>
    <path d="M200 94 v24" stroke="#8c2f39" stroke-width="4" stroke-linecap="round"/>
    <path d="M189 106 l11 12 l11 -12" fill="none" stroke="#8c2f39" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="168" y="120" width="64" height="24" rx="8" fill="#5b7fb8" stroke="#24395e" stroke-width="3"/>
    <rect x="180" y="144" width="40" height="22" rx="8" fill="#ffffff" stroke="#24395e" stroke-width="3"/>
    <text x="200" y="204" font-family="'Noto Sans Thai','Sarabun',sans-serif" font-size="17" text-anchor="middle" fill="#24395e">น้ำหนักเกิน</text>
    <text x="200" y="228" font-family="'Noto Sans Thai','Sarabun',sans-serif" font-size="14" text-anchor="middle" fill="#56607a">รับน้ำหนักมาก</text>
  </g>

  <!-- นั่งยอง นั่งพับเพียบ / squatting -->
  <g>
    <circle cx="322" cy="104" r="13" fill="#ffffff" stroke="#24395e" stroke-width="3"/>
    <path d="M322 118 v26 l-22 18" fill="none" stroke="#24395e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M322 144 l24 6 l-8 22 h-40" fill="none" stroke="#24395e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="346" cy="150" r="9" fill="none" stroke="#8c2f39" stroke-width="4"/>
    <text x="326" y="204" font-family="'Noto Sans Thai','Sarabun',sans-serif" font-size="17" text-anchor="middle" fill="#24395e">นั่งยอง</text>
    <text x="326" y="228" font-family="'Noto Sans Thai','Sarabun',sans-serif" font-size="14" text-anchor="middle" fill="#56607a">พับเพียบ งอเข่ามาก</text>
  </g>

  <text x="200" y="272" font-family="'Noto Sans Thai','Sarabun',sans-serif" font-size="17" text-anchor="middle" fill="#8c2f39">รวมถึงการบาดเจ็บที่ข้อเข่า</text>
</svg>
